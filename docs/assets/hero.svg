<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">dsh-credential-hub</title>
  <desc id="desc">A dark banner for dsh-credential-hub: metadata in the prompt, secrets on the Host.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.52" stop-color="#0a2036"/>
      <stop offset="1" stop-color="#0e3550"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1260 220) rotate(90) scale(460 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(760 520) rotate(-90) scale(420 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020a12" flood-opacity="0.55"/>
    </filter>
    <clipPath id="cardClip"><rect x="960" y="118" width="560" height="404" rx="20"/></clipPath>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>
  <rect width="1600" height="640" fill="url(#glow2)"/>
  <path d="M0 560C280 500 420 610 760 545s520-100 840-15v110H0V560Z" fill="#06121f" opacity="0.55"/>

  <g transform="translate(80 76)">
    <rect width="50" height="50" rx="12" fill="#0b1f31" stroke="#2c5570" stroke-width="1.4"/>
    <path d="M25 8 40 14v11c0 9-6 15.5-15 20-9-4.5-15-11-15-20V14L25 8Z" fill="none" stroke="#dbeafe" stroke-width="2.2"/>
    <circle cx="25" cy="23" r="3.4" fill="none" stroke="#5eead4" stroke-width="2"/>
    <path d="M25 26.4V32" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="148" y="99" fill="#9fb6c9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3.2">FOR DEEPSEEK HARNESS</text>
  <text x="148" y="124" fill="#f8fafc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.2">dsh-credential-hub</text>

  <text x="80" y="258" fill="#f8fafc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6">Metadata in the prompt.</text>
  <text x="80" y="318" fill="#5eead4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.6">Secrets on the Host.</text>
  <text x="80" y="362" fill="#9fb6c9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18">Tag-matched SSH and PAT routing with write-only values and encrypted transfer.</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6">
    <rect x="80" y="402" width="126" height="34" rx="17" fill="#0b2438" stroke="#2b5872"/>
    <text x="143" y="424" fill="#bae6fd" text-anchor="middle">SSH HOSTS</text>
    <rect x="218" y="402" width="122" height="34" rx="17" fill="#0b2438" stroke="#2b5872"/>
    <text x="279" y="424" fill="#bae6fd" text-anchor="middle">PAT TOKENS</text>
    <rect x="352" y="402" width="172" height="34" rx="17" fill="#0b2438" stroke="#2b5872"/>
    <text x="438" y="424" fill="#bae6fd" text-anchor="middle">AES-256-GCM</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="118" width="560" height="404" rx="20" fill="#081725" fill-opacity="0.94" stroke="#2c5570" stroke-width="1.2"/>
  </g>
  <g clip-path="url(#cardClip)">
    <rect x="960" y="118" width="560" height="404" fill="#081725" fill-opacity="0.55"/>
    <rect x="960" y="118" width="560" height="54" fill="#0b2134"/>
    <circle cx="986" cy="145" r="4" fill="#fb7185"/>
    <circle cx="1001" cy="145" r="4" fill="#fbbf24"/>
    <circle cx="1016" cy="145" r="4" fill="#34d399"/>
    <text x="1044" y="150" fill="#cbe4f5" font-family="Menlo, Monaco, monospace" font-size="13">credential_hub_match</text>
    <text x="1472" y="150" fill="#5eead4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" letter-spacing="1.2">HOST-SIDE</text>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="990" y="206" fill="#f8fafc" font-size="21" font-weight="600">prod-web-01</text>
      <text x="990" y="229" fill="#7f9bb0" font-size="12">env:production · service:web</text>
      <rect x="1378" y="188" width="112" height="26" rx="13" fill="#0d2e28" stroke="#1f6b57"/>
      <circle cx="1394" cy="201" r="4" fill="#34d399"/>
      <text x="1404" y="205" fill="#86efac" font-size="11" font-weight="600">configured</text>

      <line x1="990" y1="251" x2="1490" y2="251" stroke="#17384f"/>
      <text x="990" y="288" fill="#f8fafc" font-size="21" font-weight="600">github-prod</text>
      <text x="990" y="311" fill="#7f9bb0" font-size="12">platform:github · env:production</text>
      <rect x="1378" y="270" width="112" height="26" rx="13" fill="#0d2e28" stroke="#1f6b57"/>
      <circle cx="1394" cy="283" r="4" fill="#34d399"/>
      <text x="1404" y="287" fill="#86efac" font-size="11" font-weight="600">configured</text>

      <line x1="990" y1="333" x2="1490" y2="333" stroke="#17384f"/>
      <text x="990" y="370" fill="#f8fafc" font-size="21" font-weight="600">staging-db</text>
      <text x="990" y="393" fill="#7f9bb0" font-size="12">env:staging · service:db</text>
      <rect x="1378" y="352" width="112" height="26" rx="13" fill="#33250c" stroke="#7c5a1d"/>
      <circle cx="1394" cy="365" r="4" fill="#fbbf24"/>
      <text x="1404" y="369" fill="#fde68a" font-size="11" font-weight="600">not configured</text>

      <rect x="990" y="432" width="500" height="58" rx="10" fill="#07131f" stroke="#1c4058"/>
      <path d="M1012 453v-7a7 7 0 0 1 14 0v7m-17 0h20v16h-20z" fill="none" stroke="#5eead4" stroke-width="1.6"/>
      <text x="1044" y="466" fill="#9fb6c9" font-family="Menlo, Monaco, monospace" font-size="12">credentialRef →</text>
      <text x="1168" y="466" fill="#5eead4" font-family="Menlo, Monaco, monospace" font-size="12">••••••••••••</text>
      <text x="1470" y="466" fill="#527087" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">never returned</text>
    </g>
  </g>
  <text x="80" y="596" fill="#5e7b91" font-family="Menlo, Monaco, monospace" font-size="12">github.com/PandaBoby/dsh-credential-hub</text>
  <text x="1520" y="596" fill="#5e7b91" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" text-anchor="end">v0.2.2 · MIT</text>
</svg>
